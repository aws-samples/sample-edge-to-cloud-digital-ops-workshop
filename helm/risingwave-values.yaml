# ──────────────────────────────────────────────────────────────────────────────
# risingwave-values.yaml — operator chart overrides for cloud EKS
#
# Usage:
#   helm repo add risingwavelabs https://risingwavelabs.github.io/helm-charts
#   helm repo update
#   helm upgrade --install risingwave-operator risingwavelabs/risingwave-operator \
#     -n risingwave-system --create-namespace \
#     -f helm/risingwave-values.yaml
#
# After the operator is running, apply the RisingWave CR into your participant namespace:
#   sed "s/\${DEPLOYMENT_ID}/ws-slot00/g" k8s/risingwave-cloud.yaml | kubectl apply -n ws-slot00 -f -
# ──────────────────────────────────────────────────────────────────────────────

# The operator itself is stateless and lightweight — one pod manages CRs
# cluster-wide.  These limits are appropriate for t3.medium worker nodes.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Leader election is enabled by default; keep it on for safety.
leaderElection:
  enabled: true

# Install the RisingWave CRD if it is not already present.
installCRDs: true

# Watch all namespaces so participant CRs (in ws-slotNN namespaces) are managed.
# The operator is cluster-scoped; leaving watchNamespaces empty means all namespaces.
watchNamespaces: []
