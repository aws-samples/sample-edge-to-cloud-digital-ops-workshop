{{- if .Values.dashboard.enabled }}
# ClusterIP only — deliberately no Ingress/LoadBalancer (see #159). Reach this
# via `kubectl port-forward -n <namespace> svc/<fullname>-dashboard 3000:3000`.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cloud-analytics.fullname" . }}-dashboard
  labels:
    {{- include "cloud-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  type: ClusterIP
  selector:
    {{- include "cloud-analytics.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
