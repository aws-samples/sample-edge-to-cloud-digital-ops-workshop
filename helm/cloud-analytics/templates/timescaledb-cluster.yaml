{{- if .Values.timescaledb.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.timescaledb.crName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb
spec:
  instances: {{ .Values.timescaledb.instances }}

  {{- if .Values.monitoring.enabled }}
  # Let the CNPG operator emit the PodMonitor itself — it stamps the exact pod
  # selectors + `metrics` port (9187) for its built-in exporter, and the shared
  # kube-prometheus-stack (namespace `monitoring`) discovers it. Requires the
  # monitoring.coreos.com CRDs, which on the shared EKS are installed
  # cluster-scoped before any per-slot release (see scripts/deploy-cloud-analytics.sh).
  monitoring:
    enablePodMonitor: true
  {{- end }}

  # PostgreSQL 16 with the TimescaleDB extension binaries baked in. The CNPG
  # operator, not the image, provides HA/failover/backups — only the operand
  # image changes so `CREATE EXTENSION timescaledb` and continuous aggregates
  # work. CNPG's image-tag validator rejects the official
  # `timescale/timescaledb-ha:pg16-tsX` tags (non-semver); the clevyr
  # community image is the same upstream CNPG base + TimescaleDB, tagged in
  # CNPG's expected `<pg>.<minor>-ts<ext>` form so it passes validation.
  imageName: {{ .Values.timescaledb.imageName }}

  postgresql:
    # timescaledb is a preload library — it must be loaded at server start,
    # before any database connection, or CREATE EXTENSION fails.
    shared_preload_libraries:
      - timescaledb
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      maintenance_work_mem: "128MB"
      work_mem: "8MB"
      wal_level: logical

  bootstrap:
    initdb:
      database: edge
      owner: workshop
      # postInitApplicationSQL runs inside the application database (`edge`)
      # after shared_preload_libraries is active — the right place to CREATE
      # EXTENSION and build the sensor_readings hypertable Redpanda Connect
      # writes to, plus the push-notification trigger for #160.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - |
          CREATE TABLE IF NOT EXISTS sensor_readings (
            ts_ms          BIGINT          NOT NULL,
            sensor         TEXT            NOT NULL,
            site_id        TEXT            NOT NULL,
            deployment_id  TEXT            NOT NULL,
            value          DOUBLE PRECISION,
            unit           TEXT,
            partition_time TIMESTAMPTZ     NOT NULL
          );
        - SELECT create_hypertable('sensor_readings', 'partition_time', if_not_exists => TRUE);
        - CREATE INDEX IF NOT EXISTS idx_sensor_readings_sensor ON sensor_readings(sensor, partition_time DESC);
        # #253: the shared cloud-analytics instance holds every slot's rows in
        # one hypertable — this composite index leads with deployment_id so a
        # per-slot freshness read (WHERE deployment_id = $1 AND partition_time > ...)
        # stays chunk-excluded and index-scoped instead of scanning every slot's data.
        - CREATE INDEX IF NOT EXISTS idx_sensor_readings_deployment ON sensor_readings(deployment_id, sensor, partition_time DESC);
        # postInitApplicationSQL runs as the superuser, so hand the table to
        # the workshop role — it must OWN the hypertable to build a
        # continuous aggregate on it (Block 4), not merely hold DML grants.
        - ALTER TABLE sensor_readings OWNER TO workshop;
        # ── Push path for the cloud dashboard (#160, #272) ────────────────
        # TimescaleDB/Postgres has no subscription primitive like RisingWave's
        # CREATE SUBSCRIPTION — the substitute is pg_notify() on a channel the
        # cloud-dashboard LISTENs on (its /api/stream/timescaledb route), which
        # re-runs the same fleet-wide freshness aggregate the polled
        # /api/freshness route uses. The payload only needs to wake the
        # listener, so it stays a fixed token, well under Postgres's 8000-byte
        # NOTIFY limit.
        #
        # #272: the notify is fired by a ~1s TimescaleDB background job, NOT by
        # an AFTER INSERT trigger. pg_notify() inside a trigger runs during the
        # writer's COMMIT, where PreCommit_Notify() takes an AccessExclusiveLock
        # on the shared async-notification object (pg_database oid / 0), held
        # across commit + WAL flush — which serializes every concurrent COMMIT
        # cluster-wide. Under the bulk-ingest path (redpanda-connect committing
        # 1000-row batches from N workers) that collapsed sustained write
        # throughput by ~15x (measured: ~3.5k rows/s serialized vs ~60k rows/s
        # once decoupled). #210 had already cut FOR EACH ROW → FOR EACH
        # STATEMENT, but one NOTIFY per batch commit still contends the same
        # lock; only moving it OFF the commit path removes the serialization.
        # A fixed ~1s tick lets batch writers group-commit in parallel with
        # zero notify contention, while the dashboard still wakes ~1/s (the
        # freshness panel is a ~1s sawtooth anyway). See the load-test blog
        # (docs/blog/2026-09-09-loading-the-data-stores.md) for the measurement
        # and cloud-dashboard/src/app/api/stream/timescaledb/route.ts for the
        # LISTEN/debounce half.
        #
        # Use a *named* dollar-quote tag ($tick$), not the bare $$: CNPG's
        # instance-manager collapses `$$` to a single `$` when it hands each
        # postInitApplicationSQL entry to the backend (SQLSTATE 42601 at initdb,
        # which wedges the whole cluster bootstrap). A named tag survives it.
        #
        # The job that runs this procedure is created/owned by the post-upgrade
        # notify-ddl Job (timescaledb-notify-ddl-job.yaml), which runs as the
        # `workshop` role — postInitApplicationSQL only runs once at initdb, so
        # here we just define the procedure and hand it to workshop.
        - |
          CREATE OR REPLACE PROCEDURE notify_tick(job_id int, config jsonb)
          LANGUAGE plpgsql AS $tick$
          BEGIN
            PERFORM pg_notify('sensor_readings_change', 'tick');
          END;
          $tick$;
        - ALTER PROCEDURE notify_tick(int, jsonb) OWNER TO workshop;

  storage:
    size: {{ .Values.timescaledb.storageSize }}

  resources:
    {{- toYaml .Values.timescaledb.resources | nindent 4 }}

  {{- with .Values.timescaledb.affinity }}
  # Keep primary + replica off the same node (#196) — CNPG-native anti-affinity.
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# A second database on the same CNPG cluster, dedicated to RisingWave's
# metaStore (see risingwave-cr.yaml) — keeps RisingWave's catalog/cluster_id
# out of the "edge" application database while reusing the same Postgres
# instance and the "workshop" role/credentials CNPG already manages, instead
# of standing up a separate CNPG Cluster just for meta.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.timescaledb.crName }}-risingwave-meta
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: risingwave
spec:
  name: risingwave_meta
  owner: workshop
  cluster:
    name: {{ .Values.timescaledb.crName }}
{{- end }}
