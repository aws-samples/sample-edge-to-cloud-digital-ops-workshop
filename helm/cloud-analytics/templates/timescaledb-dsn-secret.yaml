{{- if .Values.timescaledb.enabled }}
# Post-install/post-upgrade Job that derives the TIMESCALE_DSN connection
# string from the password CNPG auto-generates in "<crName>-app" — mirrors
# helm/edge-stack/templates/timescaledb-dsn-secret.yaml. Two secrets are
# written: "timescaledb-credentials" (consumed by Redpanda Connect) and
# "timescaledb-dashboard-env" (consumed by the dashboard Deployment as
# TIMESCALEDB_ENDPOINT) — same DSN, different key names for each consumer.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn
  labels:
    {{- include "cloud-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: tsdb-dsn
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "20"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "cloud-analytics.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tsdb-dsn
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn-sa
      containers:
        - name: create-dsn
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .Values.timescaledb.crName }}-app secret..."
              until kubectl get secret {{ .Values.timescaledb.crName }}-app -n {{ .Release.Namespace }} >/dev/null 2>&1; do
                sleep 5
              done
              PASSWORD=$(kubectl get secret {{ .Values.timescaledb.crName }}-app -n {{ .Release.Namespace }} \
                -o jsonpath='{.data.password}' | base64 -d)
              DSN="postgres://workshop:${PASSWORD}@{{ .Values.timescaledb.crName }}-rw.{{ .Release.Namespace }}.svc:5432/edge"
              kubectl create secret generic timescaledb-credentials \
                -n {{ .Release.Namespace }} \
                --from-literal=TIMESCALE_DSN="${DSN}" \
                --dry-run=client -o yaml | kubectl apply -f -
              kubectl create secret generic timescaledb-dashboard-env \
                -n {{ .Release.Namespace }} \
                --from-literal=TIMESCALEDB_ENDPOINT="${DSN}" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "timescaledb-credentials / timescaledb-dashboard-env secrets created."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "15"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn-role
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "15"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "apply", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn-rb
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "15"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn-role
subjects:
  - kind: ServiceAccount
    name: {{ include "cloud-analytics.fullname" . }}-tsdb-dsn-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
