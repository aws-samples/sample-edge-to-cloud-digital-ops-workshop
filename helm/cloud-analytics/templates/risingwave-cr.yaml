apiVersion: risingwave.risingwavelabs.com/v1alpha1
kind: RisingWave
metadata:
  name: {{ .Values.risingwave.crName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: risingwave
spec:
  image: {{ .Values.risingwave.image | quote }}

  # ── State store: S3 via IRSA — one bucket per slot, no static credentials.
  stateStore:
    s3:
      bucket: {{ printf "workshop-%s-%s-risingwave-state" .Values.deploymentId .Values.accountId }}
      region: {{ .Values.risingwave.stateBucketRegion }}
      credentials:
        useServiceAccount: true

  # ── Meta store: PostgreSQL, on the same CNPG-managed cluster that backs
  # TimescaleDB, in its own "risingwave_meta" database (created below via a
  # CNPG Database CR). In-memory meta (the operator's default) does not
  # survive a pod restart, but the S3 state bucket does — every meta restart
  # then mints a fresh cluster_id while S3 still holds the previous one's
  # hummock/cluster_id/0 marker, and meta refuses to start
  # ("Data directory is already used by another cluster with id..."). A
  # durable meta store keeps cluster_id (and all other catalog metadata)
  # persisted alongside the S3 state it describes, so the two never diverge.
  metaStore:
    postgresql:
      host: {{ printf "%s-rw.%s.svc" .Values.timescaledb.crName .Release.Namespace }}
      port: 5432
      database: risingwave_meta
      credentials:
        secretName: {{ printf "%s-app" .Values.timescaledb.crName }}

  # ── Component node groups — v2 schema: resources/envFrom at template.spec level
  components:
    meta:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: {{ .Values.risingwave.serviceAccountName }}
              {{- if .Values.risingwave.podAntiAffinity.enabled }}
              # Prefer scheduling RW meta away from RW compute (this release) so one
              # node event can't take both freshness-critical RW pods at once (#196).
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
                        labelSelector:
                          matchLabels:
                            risingwave/name: {{ .Values.risingwave.crName }}
                            risingwave/component: compute
              {{- end }}
              envFrom:
                - secretRef:
                    name: msk-credentials
              env:
                # Checkpoint barrier cadence. RisingWave commits a checkpoint to
                # the meta store on every barrier; at very low intervals the
                # commit path (esp. an external Postgres/S3 meta+state store on a
                # 1-vCPU node) can't keep up, the committed epoch falls behind
                # wall-clock, and MV freshness lags by minutes even under trivial
                # load. Keep at the RisingWave default (1000ms) unless profiling
                # shows the commit path has headroom for a tighter interval.
                - name: RW_BARRIER_INTERVAL_MS
                  value: {{ .Values.risingwave.barrierIntervalMs | quote }}
              resources:
                {{- toYaml .Values.risingwave.resources.meta | nindent 16 }}

    frontend:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: {{ .Values.risingwave.serviceAccountName }}
              envFrom:
                - secretRef:
                    name: msk-credentials
              resources:
                {{- toYaml .Values.risingwave.resources.frontend | nindent 16 }}

    compute:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: {{ .Values.risingwave.serviceAccountName }}
              {{- if .Values.risingwave.podAntiAffinity.enabled }}
              # Prefer scheduling RW compute away from RW meta (this release) so one
              # node event can't take both freshness-critical RW pods at once (#196).
              affinity:
                podAntiAffinity:
                  preferredDuringSchedulingIgnoredDuringExecution:
                    - weight: 100
                      podAffinityTerm:
                        topologyKey: kubernetes.io/hostname
                        labelSelector:
                          matchLabels:
                            risingwave/name: {{ .Values.risingwave.crName }}
                            risingwave/component: meta
              {{- end }}
              envFrom:
                - secretRef:
                    name: msk-credentials
              env:
                # See the meta node group above — barrier cadence must match
                # across meta and compute. RisingWave default (1000ms).
                - name: RW_BARRIER_INTERVAL_MS
                  value: {{ .Values.risingwave.barrierIntervalMs | quote }}
                # Cap RisingWave's self-managed memory *below* the container
                # limit so jemalloc/stack/RocksDB overhead can't push the cgroup
                # over its limit and trigger an OOM kill (exit 137). Without this
                # the operator sizes the heap to 100% of the limit and the pod
                # gets OOMKilled, stalling barriers and spiking MV freshness.
                - name: RW_TOTAL_MEMORY_BYTES
                  value: {{ .Values.risingwave.computeTotalMemoryBytes | quote }}
              resources:
                {{- toYaml .Values.risingwave.resources.compute | nindent 16 }}

    compactor:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: {{ .Values.risingwave.serviceAccountName }}
              envFrom:
                - secretRef:
                    name: msk-credentials
              resources:
                {{- toYaml .Values.risingwave.resources.compactor | nindent 16 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.risingwave.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-analytics.labels" . | nindent 4 }}
    app.kubernetes.io/component: risingwave
  {{- if .Values.risingwave.serviceAccountRoleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.risingwave.serviceAccountRoleArn }}
  {{- end }}
