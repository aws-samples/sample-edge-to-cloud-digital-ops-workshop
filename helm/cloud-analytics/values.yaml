# ──────────────────────────────────────────────────────────────────────────────
# cloud-analytics default values
# Overridden per slot by scripts/deploy-cloud-analytics.sh via --set.
#
# Assumes the following are already in place before `helm install` (all
# handled by scripts/deploy-cloud-analytics.sh, not this chart — they are
# either cluster-scoped one-time admin actions or AWS-side calls a Helm chart
# has no business making):
#   - risingwave-operator installed cluster-wide (risingwave-system ns)
#   - cloudnative-pg operator installed cluster-wide (cnpg-system ns)
#   - cert-manager installed cluster-wide (risingwave-operator's CRDs need it)
#   - a default gp3 StorageClass
#   - this namespace exists
#   - a `msk-credentials` Secret in this namespace with MSK_BOOTSTRAP_SERVERS,
#     MSK_USERNAME, MSK_PASSWORD
#   - the RisingWave state S3 bucket (workshop-<id>-<account>-risingwave-state)
# ──────────────────────────────────────────────────────────────────────────────

# Workshop slot identifier — used as a label on all resources and to derive
# per-slot names (S3 bucket, IRSA role trust, etc.)
deploymentId: ws-slot00

# AWS account ID — needed to build the RisingWave state bucket name and the
# IRSA role ARN.
accountId: "000000000000"

awsRegion: us-east-1

# ──────────────────────────────────────────────────────────────────────────────
# Observability — per-slot PodMonitors discovered by the shared-cluster
# kube-prometheus-stack (namespace `monitoring`, installed cluster-scoped by
# scripts/deploy-cloud-analytics.sh alongside cert-manager / the operators).
# --8<-- [start:cloud-monitoring-toggle]
#
# DEFAULT ON (unlike the edge): on the shared EKS the monitoring.coreos.com CRDs
# are installed cluster-scoped BEFORE any per-slot cloud-analytics release, so
# there is no CRD-ordering hazard. Set monitoring.enabled=false only when
# deploying a slot into a cluster whose prometheus-operator CRDs are absent.
monitoring:
  enabled: true
  releaseLabel: monitoring
# --8<-- [end:cloud-monitoring-toggle]

# risingwave/ddl-cloud.sql, supplied via `--set-file risingwaveDdl=...` by
# scripts/deploy-cloud-analytics.sh — see risingwave-ddl-job.yaml.
risingwaveDdl: ""

# ──────────────────────────────────────────────────────────────────────────────
# RisingWave
# ──────────────────────────────────────────────────────────────────────────────
risingwave:
  crName: risingwave-cloud
  image: "docker.risingwave.com/risingwavelabs/risingwave:v2.8.4"
  serviceAccountName: risingwave-cloud

  # ── Placement / resilience (#196) ────────────────────────────────────────────
  # On the shared EKS, every workshop node is a burstable t3.medium (~3.4Gi,
  # ~1.9 vCPU allocatable) and pod limits oversubscribe it (observed 163% memory /
  # 155% CPU of allocatable on a single node). When one such node flaps to
  # NotReady it evicts whatever streaming/stateful pods happen to share it — live
  # we saw a single node event take down RW compute for one slot AND TimescaleDB +
  # compactor for another at the same instant. Kafka sources then report
  # AllBrokersDown and the committed MV epoch falls minutes behind wall-clock, so
  # the dashboard reads a 100s+ freshness spike.
  #
  # podAntiAffinity keeps the freshness-critical components (RW meta, RW compute,
  # and — via timescaledb.affinity below — the TimescaleDB primary) OFF the same
  # node as each other, so no single node event can down the whole tier at once.
  # `preferred` (soft), not `required`: on a small cluster a hard rule could leave
  # a pod Pending, which is a worse freshness outcome than co-location. It is
  # applied per-slot within THIS release (matchLabels scope the release + the two
  # RW components), so it spreads a slot's own critical pods without fighting other
  # slots' placement. The deeper fix — a dedicated memory-optimized, non-burstable
  # node group for the analytics tier — is a platform-stack change tracked in the
  # block-5 node-sizing guidance, not something a per-slot chart can do.
  podAntiAffinity:
    enabled: true
  # IAM role trusted for IRSA — created once by WorkshopPlatformStack, trusts
  # any `risingwave-cloud` service account cluster-wide (see
  # amplify/custom/platform-stack.ts).
  serviceAccountRoleArn: ""
  stateBucketRegion: us-east-1

  # Checkpoint barrier interval (ms). RisingWave commits a checkpoint to the meta
  # store every barrier; too tight an interval saturates the commit path on a
  # small (1-vCPU) node, so the committed epoch — and therefore MV freshness —
  # falls minutes behind wall-clock even under trivial load. 1000ms is the
  # RisingWave default; do not lower without profiling the commit path.
  barrierIntervalMs: 1000

  # Memory budget RisingWave sizes its own heap/caches to, in bytes. The operator
  # otherwise defaults RW_TOTAL_MEMORY_BYTES to the *entire* container memory
  # limit, leaving nothing for jemalloc overhead, thread stacks and the Hummock
  # block cache — so the cgroup OOM-kills the pod (exit 137) even though
  # RisingWave believes it is within budget. When compute OOMs, streaming
  # barriers stop advancing and MV freshness climbs (observed ~10s spikes on the
  # data-freshness panel between kills, then recovers — a sawtooth). Keep this
  # comfortably below resources.compute.limits.memory so both steady-state AND
  # the transient burst during startup source-backfill (RisingWave replays the
  # whole sensors.raw.sim topic and flushes SSTs) stay under the cgroup limit.
  # 1.5Gi reserved under a 3Gi limit leaves ~50% headroom for that backfill spike
  # on the workshop's t3.medium nodes (~3.4Gi allocatable).
  computeTotalMemoryBytes: "1610612736"  # 1.5 GiB, well under the 3Gi limit below

  resources:
    meta:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    frontend:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    compute:
      # request stays at 1Gi so the pod schedules on a ~3.4Gi t3.medium already
      # sharing the node with timescaledb; the 3Gi limit is burst headroom (limits
      # may oversubscribe the node, only requests must fit) to absorb the
      # startup-backfill spike without a cgroup OOM kill.
      requests: { cpu: 500m, memory: 1Gi }
      limits: { cpu: 1000m, memory: 3Gi }
    compactor:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }

# ──────────────────────────────────────────────────────────────────────────────
# TimescaleDB (via the cluster-scoped CNPG operator)
# ──────────────────────────────────────────────────────────────────────────────
timescaledb:
  enabled: true
  crName: timescaledb-cloud
  imageName: ghcr.io/clevyr/cloudnativepg-timescale:16.4-ts2.16
  instances: 2
  storageSize: 50Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 2Gi }
  # Keep the two TimescaleDB instances (primary + replica) on separate nodes so a
  # single NodeNotReady can't take the primary AND its failover target at once
  # (#196). CNPG's native anti-affinity — `preferred` by default, so it won't wedge
  # scheduling on a small cluster.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda Connect — MSK → TimescaleDB sink pipeline
# ──────────────────────────────────────────────────────────────────────────────
rpConnectTimescaledb:
  enabled: true

rp-connect-timescaledb:
  replicaCount: 1

  image:
    repository: docker.redpanda.com/redpandadata/connect
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

  envFrom:
    - secretRef:
        name: msk-credentials
    - secretRef:
        name: timescaledb-credentials

  extraVolumes:
    - name: pipeline-config
      configMap:
        name: rp-connect-timescaledb-config

  extraVolumeMounts:
    - name: pipeline-config
      mountPath: /connect/config.yaml
      subPath: config.yaml

  args:
    - run
    - /connect/config.yaml

# ──────────────────────────────────────────────────────────────────────────────
# Dashboard app (cloud-dashboard/) — Deployment + ClusterIP Service only,
# reached via `kubectl port-forward` (no ingress/LoadBalancer, see #159).
# ──────────────────────────────────────────────────────────────────────────────
dashboard:
  enabled: true
  image:
    repository: workshop-cloud-dashboard
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 3000
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # Athena tier — optional. The dashboard falls back to mock data for this
  # tier (same as local dev) unless ATHENA_DATABASE is set AND the pod's IAM
  # role grants athena:StartQueryExecution/GetQueryExecution/GetQueryResults +
  # Glue read on workshop_telemetry + S3 read/write on the workgroup's results
  # location. Wiring that IAM role (e.g. via IRSA) is left to the deployer —
  # RisingWave and TimescaleDB are the two tiers this chart guarantees live.
  athenaDatabase: ""
  athenaWorkgroup: workshop-shared
  athenaTable: telemetry
