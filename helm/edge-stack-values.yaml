# ──────────────────────────────────────────────────────────────────────────────
# edge-stack-values.yaml — workshop slot override file
#
# Usage:
#   helm upgrade --install edge-stack helm/edge-stack \
#     -f helm/edge-stack-values.yaml \
#     --namespace edge --create-namespace
#
# Replace placeholder values (marked TODO) before deploying.
# ──────────────────────────────────────────────────────────────────────────────

# Slot identifier — printed in UI, used as Kafka consumer-group suffix.
deploymentId: ws-slot00

# MSK bootstrap servers for the WAN relay
mskBootstrapServers: "b-2.workshopwsslot00msk.gb4nxb.c17.kafka.us-east-1.amazonaws.com:9096,b-1.workshopwsslot00msk.gb4nxb.c17.kafka.us-east-1.amazonaws.com:9096"

# MQTT broker — Mosquitto runs on the sensor simulator EC2, NOT in K3s.
mqtt:
  host: "10.0.0.5"
  port: 1883

# ──────────────────────────────────────────────────────────────────────────────
# HMI
# ──────────────────────────────────────────────────────────────────────────────
hmi:
  enabled: true
  image:
    repository: workshop-hmi
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  service:
    type: NodePort
    port: 3000
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda — single-node, 1 GB heap, 2 GB data volume
# ──────────────────────────────────────────────────────────────────────────────
redpanda:
  enabled: true

  statefulset:
    replicas: 1

  tls:
    enabled: false

  auth:
    sasl:
      enabled: false

  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: "2Gi"
      redpanda:
        memory: "1Gi"
        reserveMemory: "256Mi"

  storage:
    persistentVolume:
      enabled: true
      size: "2Gi"

  rackAwareness:
    enabled: false

  config:
    cluster:
      auto_create_topics_enabled: true

  console:
    enabled: true
    service:
      type: NodePort
      nodePort: 30900
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda Connect — ingest (MQTT → Redpanda)
# ──────────────────────────────────────────────────────────────────────────────
rpConnectIngest:
  enabled: true

rp-connect-ingest:
  fullnameOverride: edge-stack-rp-connect-ingest
  replicaCount: 1
  extraVolumes:
    - name: pipeline-config
      configMap:
        name: rp-connect-ingest-config
  extraVolumeMounts:
    - name: pipeline-config
      mountPath: /connect/config.yaml
      subPath: config.yaml
  args:
    - run
    - /connect/config.yaml
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda Connect — relay (Redpanda → MSK)
# ──────────────────────────────────────────────────────────────────────────────
rpConnectRelay:
  enabled: true

rp-connect-relay:
  fullnameOverride: edge-stack-rp-connect-relay
  replicaCount: 1
  extraVolumes:
    - name: pipeline-config
      configMap:
        name: rp-connect-relay-config
  extraVolumeMounts:
    - name: pipeline-config
      mountPath: /connect/config.yaml
      subPath: config.yaml
  args:
    - run
    - /connect/config.yaml
  envFrom:
    - secretRef:
        name: msk-credentials
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda Connect — TimescaleDB sink (Redpanda → local PostgreSQL)
# ──────────────────────────────────────────────────────────────────────────────
rpConnectTsdb:
  enabled: true

rp-connect-tsdb:
  fullnameOverride: edge-stack-rp-connect-tsdb
  replicaCount: 1
  extraVolumes:
    - name: pipeline-config
      configMap:
        name: rp-connect-tsdb-config
  extraVolumeMounts:
    - name: pipeline-config
      mountPath: /connect/config.yaml
      subPath: config.yaml
  args:
    - run
    - /connect/config.yaml
  envFrom:
    - secretRef:
        name: timescaledb-dsn
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ──────────────────────────────────────────────────────────────────────────────
# RisingWave — minimal single-node (standalone topology)
# ──────────────────────────────────────────────────────────────────────────────
risingwave:
  enabled: true

  standalone:
    enabled: true

  metaStore:
    sqlite:
      enabled: true

  stateStore:
    s3:
      enabled: true
      bucket: risingwave
      endpoint: "http://edge-stack-minio:9000"
      region: us-east-1
      forcePathStyle: true
      authentication:
        useServiceAccount: false
        accessKey: minioadmin
        secretAccessKey: minioadmin

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  persistence:
    size: 2Gi

# ──────────────────────────────────────────────────────────────────────────────
# CloudNativePG operator
# ──────────────────────────────────────────────────────────────────────────────
cnpg:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ──────────────────────────────────────────────────────────────────────────────
# MinIO — standalone, single node
# ──────────────────────────────────────────────────────────────────────────────
minio:
  enabled: true
  mode: standalone
  replicas: 1
  rootUser: minioadmin
  rootPassword: minioadmin
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    port: 9000
  consoleService:
    type: NodePort
    nodePort: 30901
  buckets:
    - name: risingwave
      policy: none
      purge: false
    - name: edge-data
      policy: none
      purge: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
