# ──────────────────────────────────────────────────────────────────────────────
# edge-stack-values.yaml — workshop slot override file
#
# Usage:
#   helm upgrade --install edge-stack helm/edge-stack \
#     -f helm/edge-stack-values.yaml \
#     --namespace edge --create-namespace
#
# Replace placeholder values (marked TODO) before deploying.
# ──────────────────────────────────────────────────────────────────────────────

# Slot identifier — printed in UI, used as Kafka consumer-group suffix.
deploymentId: workshop-slot00   # TODO: set per participant, e.g. workshop-slot01

# MSK bootstrap servers for the WAN relay (TODO: fill in your MSK endpoint)
mskBootstrapServers: "b-1.replace-me.kafka.us-east-1.amazonaws.com:9092,b-2.replace-me.kafka.us-east-1.amazonaws.com:9092"

# MQTT broker — Mosquitto runs on the sensor simulator EC2, NOT in K3s.
# Set host to the private IP of the workshop-{DEPLOYMENT_ID}-sensor-sim EC2 instance.
# Retrieve it with:
#   aws ec2 describe-instances --filters "Name=tag:Name,Values=workshop-{DEPLOYMENT_ID}-sensor-sim" \
#     --query "Reservations[0].Instances[0].PrivateIpAddress" --output text
mqtt:
  host: "0.0.0.0"  # TODO: replace with sensor-sim EC2 private IP
  port: 1883

# ──────────────────────────────────────────────────────────────────────────────
# HMI
# ──────────────────────────────────────────────────────────────────────────────
hmi:
  enabled: true
  image:
    repository: workshop-hmi
    tag: latest
    pullPolicy: Never
  replicaCount: 1
  service:
    type: NodePort
    port: 3000
    nodePort: 30080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda — single-node, 1 GB heap, 2 GB data volume
# ──────────────────────────────────────────────────────────────────────────────
redpanda:
  enabled: true

  statefulset:
    replicas: 1

  tls:
    enabled: false

  auth:
    sasl:
      enabled: false

  resources:
    cpu:
      cores: 1
    memory:
      container:
        max: "2Gi"
      redpanda:
        memory: "1Gi"
        reserveMemory: "256Mi"

  storage:
    persistentVolume:
      enabled: true
      size: "2Gi"

  rackAwareness:
    enabled: false

  console:
    enabled: true
    service:
      type: NodePort
      nodePort: 30900
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda Connect — ingest (MQTT → Redpanda)
# ──────────────────────────────────────────────────────────────────────────────
rpConnectIngest:
  enabled: true

rp-connect-ingest:
  replicaCount: 1
  extraVolumes:
    - name: pipeline-config
      configMap:
        name: rp-connect-ingest-config
  extraVolumeMounts:
    - name: pipeline-config
      mountPath: /connect/config.yaml
      subPath: config.yaml
  args:
    - run
    - /connect/config.yaml
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ──────────────────────────────────────────────────────────────────────────────
# Redpanda Connect — relay (Redpanda → MSK)
# ──────────────────────────────────────────────────────────────────────────────
rpConnectRelay:
  enabled: true

rp-connect-relay:
  replicaCount: 1
  extraVolumes:
    - name: pipeline-config
      configMap:
        name: rp-connect-relay-config
  extraVolumeMounts:
    - name: pipeline-config
      mountPath: /connect/config.yaml
      subPath: config.yaml
  args:
    - run
    - /connect/config.yaml
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ──────────────────────────────────────────────────────────────────────────────
# RisingWave — minimal single-node (standalone topology)
# ──────────────────────────────────────────────────────────────────────────────
risingwave:
  enabled: true

  standalone:
    enabled: true

  metaStore:
    sqlite:
      enabled: true

  stateStore:
    s3:
      enabled: true
      bucket: risingwave
      endpoint: "http://edge-stack-minio:9000"
      region: us-east-1
      accessKey: minioadmin
      secretKey: minioadmin

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  persistence:
    size: 2Gi

# ──────────────────────────────────────────────────────────────────────────────
# CloudNativePG operator
# ──────────────────────────────────────────────────────────────────────────────
cnpg:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ──────────────────────────────────────────────────────────────────────────────
# MinIO — standalone, single node
# ──────────────────────────────────────────────────────────────────────────────
minio:
  enabled: true
  mode: standalone
  replicas: 1
  rootUser: minioadmin
  rootPassword: minioadmin
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    port: 9000
  consoleService:
    type: NodePort
    nodePort: 30901
  buckets:
    - name: risingwave
      policy: none
      purge: false
    - name: edge-data
      policy: none
      purge: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
