apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-stack.fullname" . }}-hmi
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: hmi
spec:
  replicas: {{ .Values.hmi.replicaCount }}
  selector:
    matchLabels:
      {{- include "edge-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: hmi
  template:
    metadata:
      labels:
        {{- include "edge-stack.labels" . | nindent 8 }}
        app.kubernetes.io/component: hmi
    spec:
      containers:
        - name: hmi
          image: "{{ .Values.hmi.image.repository }}:{{ .Values.hmi.image.tag }}"
          imagePullPolicy: {{ .Values.hmi.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DEPLOYMENT_ID
              value: {{ .Values.deploymentId | quote }}
            - name: RISINGWAVE_HOST
              value: {{ .Values.risingwave.serviceName | default "edge-stack-risingwave" | quote }}
            - name: RISINGWAVE_PORT
              value: "4567"
            # Edge Redpanda Admin API (Prometheus /public_metrics) — used by the
            # WAN Relay Backlog card to read the relay consumer group's lag.
            - name: REDPANDA_ADMIN_URL
              value: "http://{{ .Release.Name }}-0.{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:9644"
            - name: RELAY_CONSUMER_GROUP
              value: "relay-group-{{ .Values.deploymentId }}"
            - name: RELAY_TOPIC
              value: "sensors.raw.sim"
            - name: TIMESCALE_HOST
              value: "timescaledb-rw"
            - name: TIMESCALE_PORT
              value: "5432"
            - name: TIMESCALE_DB
              value: "edge"
            - name: TIMESCALE_USER
              value: "workshop"
            - name: TIMESCALE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-app
                  key: password
                  optional: true
          resources:
            {{- toYaml .Values.hmi.resources | nindent 12 }}
