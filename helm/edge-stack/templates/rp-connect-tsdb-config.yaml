apiVersion: v1
kind: ConfigMap
metadata:
  name: rp-connect-tsdb-config
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: rp-connect-tsdb
data:
  config.yaml: |
    # ──────────────────────────────────────────────────────────────────────────
    # Redpanda Connect pipeline: local Redpanda sensors.raw.* → PostgreSQL
    # ──────────────────────────────────────────────────────────────────────────
    input:
      kafka_franz:
        seed_brokers:
          - {{ include "edge-stack.fullname" . }}-0.{{ include "edge-stack.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:9093
        topics:
          - sensors.raw.sim
        consumer_group: tsdb-sink-{{ .Values.deploymentId }}
        start_from_oldest: true
        checkpoint_limit: 1024

    pipeline:
      processors:
        - mapping: |
            root = this
            root.partition_time = ((this.ts_ms / 60000).floor() * 60).ts_unix().format_timestamp("2006-01-02T15:04:00Z07:00")

    output:
      sql_insert:
        driver: postgres
        dsn: "${TIMESCALE_DSN}"
        table: sensor_readings
        columns:
          - sensor
          - site_id
          - value
          - unit
          - ts_ms
          - partition_time
        args_mapping: |
          root = [
            this.sensor,
            this.site_id,
            this.value,
            this.unit,
            this.ts_ms,
            this.partition_time
          ]
        max_in_flight: 64
        batching:
          count: 500
          period: "2s"
