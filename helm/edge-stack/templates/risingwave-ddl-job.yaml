{{- if .Values.risingwave.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edge-stack.fullname" . }}-rw-ddl
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: risingwave-ddl
  annotations:
    # Run after all resources are installed; delete on next upgrade/uninstall
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "10"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        {{- include "edge-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: risingwave-ddl
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ddl
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for RisingWave to be ready..."
              until pg_isready -h {{ .Values.risingwave.serviceName | default "edge-stack-risingwave" }} -p 4566 -U root; do
                sleep 3
              done
              echo "Running DDL..."
              psql -h {{ .Values.risingwave.serviceName | default "edge-stack-risingwave" }} \
                   -p 4566 -U root -f /ddl/ddl.sql
              echo "DDL complete."
          volumeMounts:
            - name: ddl
              mountPath: /ddl
      volumes:
        - name: ddl
          configMap:
            name: {{ include "edge-stack.fullname" . }}-rw-ddl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-stack.fullname" . }}-rw-ddl
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "5"
data:
  ddl.sql: |
{{ .Files.Get "files/ddl.sql" | indent 4 }}
{{- end }}
