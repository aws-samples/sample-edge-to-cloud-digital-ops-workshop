apiVersion: v1
kind: ConfigMap
metadata:
  name: rp-connect-ingest-config
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: rp-connect-ingest
data:
  config.yaml: |
    # ──────────────────────────────────────────────────────────────────────────
    # Redpanda Connect pipeline: MQTT sensors/raw/# → Redpanda sensors.raw.*
    # ──────────────────────────────────────────────────────────────────────────
    input:
      mqtt:
        urls:
          - tcp://{{ .Values.mqtt.host }}:{{ .Values.mqtt.port }}
        # Subscribe to all sensor subtopics
        topics:
          - sensors/raw/#
        client_id: rp-connect-ingest-{{ .Values.deploymentId }}
        # Clean session so we don't retain stale subscriptions on restart
        clean_session: true
        connect_timeout: 30s
        keepalive: 30

    pipeline:
      processors:
        # All MQTT sensor messages funnel into the single sensors.raw.sim topic.
        # The JSON payload already carries sensor, site_id, value, unit, ts_ms.
        - mapping: |
            root = this

    output:
      kafka_franz:
        seed_brokers:
          - {{ include "edge-stack.fullname" . }}-0.{{ include "edge-stack.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:9093
        topic: sensors.raw.sim
        # Deliver at least once — acceptable for workshop ingest
        acks: all
        idempotent_write: false
        compression: snappy
        max_in_flight: 64
