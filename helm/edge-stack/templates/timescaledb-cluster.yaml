{{- if or .Values.timescaledb.enabled .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: timescaledb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb
spec:
  instances: 1
  # TimescaleDB extension baked into a CNPG-compatible operand image (see the
  # cloud cluster manifest for why the official timescale/timescaledb-ha tag
  # can't be used with CNPG). The operator still owns HA/failover/backups.
  imageName: ghcr.io/clevyr/cloudnativepg-timescale:16.4-ts2.16
  postgresql:
    shared_preload_libraries:
      - timescaledb
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      maintenance_work_mem: "64MB"
      work_mem: "4MB"
      wal_level: logical
  bootstrap:
    initdb:
      database: edge
      owner: workshop
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - |
          CREATE TABLE IF NOT EXISTS sensor_readings (
            ts_ms          BIGINT          NOT NULL,
            sensor         TEXT            NOT NULL,
            site_id        TEXT            NOT NULL,
            value          DOUBLE PRECISION,
            unit           TEXT,
            partition_time TIMESTAMPTZ     NOT NULL
          );
        - SELECT create_hypertable('sensor_readings', 'partition_time', if_not_exists => TRUE);
        - CREATE INDEX IF NOT EXISTS idx_sr_sensor ON sensor_readings(sensor, partition_time DESC);
        # workshop must OWN the hypertable to build continuous aggregates on it.
        - "ALTER TABLE sensor_readings OWNER TO workshop;"
  storage:
    size: 10Gi
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
{{- end }}
