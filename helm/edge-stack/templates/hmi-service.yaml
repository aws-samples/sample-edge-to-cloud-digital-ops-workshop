apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-stack.fullname" . }}-hmi
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: hmi
spec:
  type: {{ .Values.hmi.service.type }}
  selector:
    {{- include "edge-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hmi
  ports:
    - name: http
      port: {{ .Values.hmi.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.hmi.service.type "NodePort") .Values.hmi.service.nodePort }}
      nodePort: {{ .Values.hmi.service.nodePort }}
      {{- end }}
