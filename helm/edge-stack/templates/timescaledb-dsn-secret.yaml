{{- if .Values.cnpg.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edge-stack.fullname" . }}-tsdb-dsn
  labels:
    {{- include "edge-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: tsdb-dsn
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "20"
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        {{- include "edge-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tsdb-dsn
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "edge-stack.fullname" . }}-tsdb-dsn-sa
      containers:
        - name: create-dsn
          image: bitnami/kubectl:latest
          command:
            - sh
            - -c
            - |
              echo "Waiting for timescaledb-app secret..."
              until kubectl get secret timescaledb-app -n {{ .Release.Namespace }} >/dev/null 2>&1; do
                sleep 5
              done
              PASSWORD=$(kubectl get secret timescaledb-app -n {{ .Release.Namespace }} \
                -o jsonpath='{.data.password}' | base64 -d)
              DSN="postgres://workshop:${PASSWORD}@timescaledb-rw.{{ .Release.Namespace }}.svc:5432/edge"
              kubectl create secret generic timescaledb-dsn \
                -n {{ .Release.Namespace }} \
                --from-literal=TIMESCALE_DSN="${DSN}" \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "timescaledb-dsn secret created."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "edge-stack.fullname" . }}-tsdb-dsn-sa
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "15"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "edge-stack.fullname" . }}-tsdb-dsn-role
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "15"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "apply", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "edge-stack.fullname" . }}-tsdb-dsn-rb
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "15"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "edge-stack.fullname" . }}-tsdb-dsn-role
subjects:
  - kind: ServiceAccount
    name: {{ include "edge-stack.fullname" . }}-tsdb-dsn-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
