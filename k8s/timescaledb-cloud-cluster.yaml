# ──────────────────────────────────────────────────────────────────────────────
# timescaledb-cloud-cluster.yaml — CNPG Cluster CR for cloud EKS TimescaleDB
#
# Apply after the CNPG operator is running in the cluster:
#   kubectl apply -f k8s/timescaledb-cloud-cluster.yaml -n analytics
#
# The primary service is timescaledb-cloud-rw (read-write, port 5432).
# The replica service is timescaledb-cloud-r (read-only).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: timescaledb-cloud
  namespace: analytics
  labels:
    app.kubernetes.io/part-of: edge-digital-ops-cloud
    app.kubernetes.io/component: timescaledb
spec:
  # 1 primary + 1 streaming standby for cloud HA.
  instances: 2

  # PostgreSQL 16 with TimescaleDB extension binaries pre-installed.
  imageName: timescale/timescaledb-ha:pg16

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL configuration
  # ────────────────────────────────────────────────────────────────────────────
  postgresql:
    parameters:
      shared_preload_libraries: "timescaledb"
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      maintenance_work_mem: "128MB"
      work_mem: "8MB"
      wal_level: logical

  # ────────────────────────────────────────────────────────────────────────────
  # Bootstrap — create the workshop database and user on first start
  # ────────────────────────────────────────────────────────────────────────────
  bootstrap:
    initdb:
      database: edge
      owner: workshop
      # CNPG creates a Secret named "timescaledb-cloud-app" containing the
      # generated password.  To pin a password, create a Secret first and set:
      #   secret:
      #     name: timescaledb-cloud-workshop-credentials

      postInitSQL:
        # 1. Activate TimescaleDB in the bootstrap database.
        - CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;

        # 2. Create the sensor_readings table that Redpanda Connect writes to.
        - |
          CREATE TABLE IF NOT EXISTS sensor_readings (
            ts_ms          BIGINT          NOT NULL,
            sensor         TEXT            NOT NULL,
            site_id        TEXT            NOT NULL,
            value          DOUBLE PRECISION,
            unit           TEXT,
            partition_time TIMESTAMPTZ     NOT NULL
          );

        # 3. Convert sensor_readings into a TimescaleDB hypertable partitioned
        #    on partition_time (which Redpanda Connect truncates to the minute).
        - SELECT create_hypertable('sensor_readings', 'partition_time', if_not_exists => TRUE);

        # 4. Composite index for per-sensor time-series queries.
        - CREATE INDEX IF NOT EXISTS idx_sensor_readings_sensor ON sensor_readings(sensor, partition_time DESC);

  # ────────────────────────────────────────────────────────────────────────────
  # Storage — 50 Gi for fleet-wide cloud data (larger than the 10 Gi edge node)
  # ────────────────────────────────────────────────────────────────────────────
  storage:
    size: 50Gi

  # ────────────────────────────────────────────────────────────────────────────
  # Resource limits — sized for m5.large or similar EKS nodes
  # ────────────────────────────────────────────────────────────────────────────
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
