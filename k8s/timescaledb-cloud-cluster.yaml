# ──────────────────────────────────────────────────────────────────────────────
# timescaledb-cloud-cluster.yaml — CNPG Cluster CR for cloud EKS TimescaleDB
#
# Apply into your participant namespace after the CNPG operator is running:
#   kubectl apply -f k8s/timescaledb-cloud-cluster.yaml -n ws-slot00
#
# The primary service is timescaledb-cloud-rw (read-write, port 5432).
# The replica service is timescaledb-cloud-r (read-only).
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: timescaledb-cloud
  # namespace is set by the kubectl apply -n flag — do not hardcode it here
  labels:
    app.kubernetes.io/part-of: edge-digital-ops-cloud
    app.kubernetes.io/component: timescaledb
spec:
  # 1 primary + 1 streaming standby for cloud HA.
  instances: 2

  # PostgreSQL 16 with the TimescaleDB extension binaries baked in.
  #
  # The CNPG operator, not the image, provides HA/failover/backups — we keep all
  # of that unchanged and only swap the *operand* image for one that ships the
  # compiled timescaledb.so, so `CREATE EXTENSION timescaledb` and continuous
  # aggregates work (see Block 4). CNPG's image-tag validator rejects the
  # official `timescale/timescaledb-ha:pg16-tsX` tags (non-semver); the clevyr
  # community image is the same upstream CNPG base + TimescaleDB, tagged in
  # CNPG's expected `<pg>.<minor>-ts<ext>` form so it passes validation.
  imageName: ghcr.io/clevyr/cloudnativepg-timescale:16.4-ts2.16

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL configuration
  # ────────────────────────────────────────────────────────────────────────────
  postgresql:
    # timescaledb is a preload library — it must be loaded at server start,
    # before any database connection, or CREATE EXTENSION fails.
    shared_preload_libraries:
      - timescaledb
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      maintenance_work_mem: "128MB"
      work_mem: "8MB"
      wal_level: logical

  # ────────────────────────────────────────────────────────────────────────────
  # Bootstrap — create the workshop database and user on first start
  # ────────────────────────────────────────────────────────────────────────────
  bootstrap:
    initdb:
      database: edge
      owner: workshop
      # CNPG creates a Secret named "timescaledb-cloud-app" containing the
      # generated password.  To pin a password, create a Secret first and set:
      #   secret:
      #     name: timescaledb-cloud-workshop-credentials

      # postInitApplicationSQL runs inside the application database (`edge`) after
      # shared_preload_libraries is active — the right place to CREATE EXTENSION
      # and build the sensor_readings hypertable Redpanda Connect writes to.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS timescaledb;
        - |
          CREATE TABLE IF NOT EXISTS sensor_readings (
            ts_ms          BIGINT          NOT NULL,
            sensor         TEXT            NOT NULL,
            site_id        TEXT            NOT NULL,
            value          DOUBLE PRECISION,
            unit           TEXT,
            partition_time TIMESTAMPTZ     NOT NULL
          );

        # Promote sensor_readings to a hypertable so continuous aggregates
        # (Block 4) can be built directly on it.
        - SELECT create_hypertable('sensor_readings', 'partition_time', if_not_exists => TRUE);
        - CREATE INDEX IF NOT EXISTS idx_sensor_readings_sensor ON sensor_readings(sensor, partition_time DESC);
        # postInitApplicationSQL runs as the superuser, so hand the table to the
        # workshop role — it must OWN the hypertable to build a continuous
        # aggregate on it (Block 4), not merely hold DML grants.
        - ALTER TABLE sensor_readings OWNER TO workshop;

        # ── Push path for the cloud dashboard (#160) ──────────────────────────
        # TimescaleDB/Postgres has no subscription primitive like RisingWave's
        # CREATE SUBSCRIPTION — the standard substitute is a trigger that calls
        # pg_notify() on every insert, paired with a server-side LISTEN
        # connection (cloud-dashboard's /api/stream/timescaledb route). The
        # notify payload only needs to wake the listener; the listener re-runs
        # the same fleet-wide aggregate query the polled /api/freshness route
        # uses, so we keep the payload minimal (no per-row fleet data) to stay
        # well under Postgres's 8000-byte NOTIFY payload limit.
        # Use a *named* dollar-quote tag ($notify$), not the bare $$: CNPG's
        # instance-manager collapses `$$` to a single `$` when it hands each
        # postInitApplicationSQL entry to the backend, producing
        # `... AS $ BEGIN ... END; $ LANGUAGE plpgsql` — a syntax error that
        # aborts initdb (SQLSTATE 42601) and wedges the whole cluster bootstrap.
        # A named tag survives the collapse intact.
        #
        # #210: this was originally FOR EACH ROW, calling pg_notify() once per
        # inserted row. redpanda-connect's sql_insert sink issues one INSERT
        # statement per row regardless of its batching config, so under a
        # burst this fired one dashboard aggregate query per row and saturated
        # the SSE route's pg pool. FOR EACH STATEMENT collapses that to one
        # notify per INSERT statement — the function can no longer read NEW
        # (there's no single row in a statement-level trigger), so the
        # payload is just a fixed wakeup token; the dashboard re-aggregates on
        # every wakeup regardless of payload contents anyway. This is only
        # half the fix — the SSE route also debounces/single-flights the
        # resulting queries (see cloud-dashboard/src/app/api/stream/timescaledb/route.ts).
        - |
          CREATE OR REPLACE FUNCTION notify_sensor_reading() RETURNS trigger AS $notify$
          BEGIN
            PERFORM pg_notify('sensor_readings_change', 'batch');
            RETURN NULL;
          END;
          $notify$ LANGUAGE plpgsql;
        - |
          DROP TRIGGER IF EXISTS sensor_readings_notify ON sensor_readings;
        - |
          CREATE TRIGGER sensor_readings_notify
            AFTER INSERT ON sensor_readings
            FOR EACH STATEMENT EXECUTE FUNCTION notify_sensor_reading();
        # The trigger function runs as the bootstrap superuser (owner of
        # sensor_readings pre-ALTER); reassign it too so `workshop` can later
        # replace/drop it without needing superuser.
        - ALTER FUNCTION notify_sensor_reading() OWNER TO workshop;
        # NB: postInitApplicationSQL only runs once, at initdb — a slot whose
        # TimescaleDB cluster was already bootstrapped before #210 keeps its
        # old FOR EACH ROW trigger unless this block is re-applied by hand:
        #   kubectl exec -it -n ws-slot00 timescaledb-cloud-1 -- psql -U workshop -d edge -c "
        #     CREATE OR REPLACE FUNCTION notify_sensor_reading() RETURNS trigger AS \$notify\$
        #     BEGIN PERFORM pg_notify('sensor_readings_change', 'batch'); RETURN NULL; END;
        #     \$notify\$ LANGUAGE plpgsql;
        #     DROP TRIGGER IF EXISTS sensor_readings_notify ON sensor_readings;
        #     CREATE TRIGGER sensor_readings_notify AFTER INSERT ON sensor_readings
        #       FOR EACH STATEMENT EXECUTE FUNCTION notify_sensor_reading();"
        # (the helm/cloud-analytics chart path re-applies this automatically via
        # helm/cloud-analytics/templates/timescaledb-notify-ddl-job.yaml on every upgrade.)

  # ────────────────────────────────────────────────────────────────────────────
  # Storage — 50 Gi for fleet-wide cloud data (larger than the 10 Gi edge node)
  # ────────────────────────────────────────────────────────────────────────────
  storage:
    size: 50Gi

  # ────────────────────────────────────────────────────────────────────────────
  # Resource limits — sized for m5.large or similar EKS nodes
  # ────────────────────────────────────────────────────────────────────────────
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
