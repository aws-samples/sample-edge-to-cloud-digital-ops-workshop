# ──────────────────────────────────────────────────────────────────────────────
# risingwave-cloud.yaml — RisingWave CR for the shared cloud EKS cluster
#
# Prerequisites:
#   1. risingwave-operator is running (helm/risingwave-values.yaml, in risingwave-system ns)
#   2. Participant namespace exists: kubectl create namespace ws-slotNN
#   3. Secret named "msk-credentials" exists in your participant namespace with:
#        MSK_USERNAME  — SASL/SCRAM username
#        MSK_PASSWORD  — SASL/SCRAM password
#        MSK_BOOTSTRAP_SERVERS — comma-separated host:port list
#
# Apply (substitute your deployment ID):
#   sed "s/\${DEPLOYMENT_ID}/ws-slot00/g" k8s/risingwave-cloud.yaml | kubectl apply -n ws-slot00 -f -
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: risingwave.risingwavelabs.com/v1alpha1
kind: RisingWave
metadata:
  name: risingwave-cloud
  namespace: ${DEPLOYMENT_ID}
  labels:
    app.kubernetes.io/part-of: edge-digital-ops-cloud
    app.kubernetes.io/component: risingwave
spec:
  # ────────────────────────────────────────────────────────────────────────────
  # State store — S3 bucket, credentials from IRSA (no static keys needed)
  # Replace {deploymentId} with your actual deployment ID before applying.
  # ────────────────────────────────────────────────────────────────────────────
  stateStore:
    s3:
      bucket: workshop-${DEPLOYMENT_ID}-risingwave-state   # TODO: substitute deployment ID
      region: us-east-1

  # ────────────────────────────────────────────────────────────────────────────
  # Meta store — etcd backed (operator deploys a sidecar etcd for workshop use)
  # ────────────────────────────────────────────────────────────────────────────
  metaStore:
    etcd:
      endpoint: "etcd:2388"

  # ────────────────────────────────────────────────────────────────────────────
  # Service account — created separately; carries the IRSA role annotation so
  # pods can access S3 without static credentials.
  # ────────────────────────────────────────────────────────────────────────────
  serviceAccountName: risingwave-cloud

  # ────────────────────────────────────────────────────────────────────────────
  # Env vars injected into every RisingWave component pod from the MSK Secret
  # ────────────────────────────────────────────────────────────────────────────
  global:
    envFrom:
      - secretRef:
          name: msk-credentials

  # ────────────────────────────────────────────────────────────────────────────
  # Component sizing — ~2 CPU / 4 GB total across all pods (workshop)
  # ────────────────────────────────────────────────────────────────────────────
  components:
    meta:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi

    frontend:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      # Expose the Postgres wire protocol inside the cluster.
      service:
        type: ClusterIP
        port: 4566

    compute:
      replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 1000m
          memory: 2Gi

    compactor:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
