# ──────────────────────────────────────────────────────────────────────────────
# risingwave-cloud.yaml — RisingWave CR for the shared cloud EKS cluster
# Schema: risingwave-operator v2.x (risingwavelabs/helm-charts)
#
# Prerequisites:
#   1. risingwave-operator is running (helm/risingwave-values.yaml, in risingwave-system ns)
#   2. Participant namespace exists: kubectl create namespace ws-slotNN
#   3. Secret named "msk-credentials" exists in your participant namespace with:
#        MSK_USERNAME, MSK_PASSWORD, MSK_BOOTSTRAP_SERVERS
#   4. Service account "risingwave-cloud" exists in your participant namespace with
#      IRSA annotation: eks.amazonaws.com/role-arn=arn:aws:iam::${ACCOUNT_ID}:role/workshop-risingwave-s3-v2
#   5. S3 bucket workshop-${DEPLOYMENT_ID}-${ACCOUNT_ID}-risingwave-state exists
#
# Apply (substitute your deployment ID and account ID):
#   sed -e "s/\${DEPLOYMENT_ID}/ws-slot00/g" -e "s/\${ACCOUNT_ID}/123456789012/g" k8s/risingwave-cloud.yaml | kubectl apply -n ws-slot00 -f -
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: risingwave.risingwavelabs.com/v1alpha1
kind: RisingWave
metadata:
  name: risingwave-cloud
  namespace: ${DEPLOYMENT_ID}
  labels:
    app.kubernetes.io/part-of: edge-digital-ops-cloud
    app.kubernetes.io/component: risingwave
spec:
  image: "docker.risingwave.com/risingwavelabs/risingwave:v2.8.4"

  # ── State store: S3 via IRSA
  stateStore:
    s3:
      bucket: workshop-${DEPLOYMENT_ID}-${ACCOUNT_ID}-risingwave-state
      region: us-east-1
      credentials:
        useServiceAccount: true

  # ── Meta store: in-memory (sufficient for workshop; resets on pod restart)
  metaStore:
    memory: true

  # ── Component node groups — v2 schema: resources/envFrom at template.spec level
  components:
    meta:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: risingwave-cloud
              envFrom:
                - secretRef:
                    name: msk-credentials
              env:
                - name: RW_BARRIER_INTERVAL_MS
                  value: "50"
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi

    frontend:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: risingwave-cloud
              envFrom:
                - secretRef:
                    name: msk-credentials
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi

    compute:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: risingwave-cloud
              envFrom:
                - secretRef:
                    name: msk-credentials
              env:
                - name: RW_BARRIER_INTERVAL_MS
                  value: "50"
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: 1000m
                  memory: 2Gi

    compactor:
      nodeGroups:
        - name: default
          replicas: 1
          template:
            spec:
              serviceAccountName: risingwave-cloud
              envFrom:
                - secretRef:
                    name: msk-credentials
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
