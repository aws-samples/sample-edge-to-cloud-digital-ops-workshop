name: Deploy Slot (PR)

# Deploys a full participant slot (Docker-built IoT Device Client + per-slot CDK)
# from a pull request, so contributors — including the @agentcore-claude remote
# agent, whose sandbox cannot run Docker — can get a live slot deployed for
# validation without local AWS credentials.
#
# Trigger is LABEL-GATED: the deploy only runs when the PR carries the `deploy`
# label (added by a maintainer or the agent). It fires when the label is added
# and on subsequent pushes to an already-labeled PR, plus a manual
# workflow_dispatch. This avoids spinning up ~20-40 min of AWS resources on
# every docs/typo PR.
#
# The slot is LEFT RUNNING after the workflow finishes so the agent can validate
# against it. Reclaim it manually with `scripts/teardown.sh <slot>` when done.

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot id to deploy (must match ws-slotNN)'
        required: false
        default: ''

concurrency:
  # One deploy at a time per slot — a second push while a deploy is mid-flight
  # would race on the same CloudFormation stacks. Do NOT cancel in-progress: a
  # half-cancelled CDK deploy leaves stacks in UPDATE_ROLLBACK_* limbo.
  group: deploy-slot-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC → AWS credentials
  contents: read
  pull-requests: write   # post the deploy result back onto the PR

env:
  AWS_REGION: us-east-1
  # Reserved CI slot. ws-slotNN → edge subnet 10.0.(16+NN).0/24, so 90 → 10.0.106.0/24,
  # well clear of participant slots 00-15. Override with the CI_DEPLOY_SLOT repo variable.
  DEFAULT_CI_SLOT: ws-slot90

jobs:
  deploy:
    # Label path: only when the PR carries `deploy`. `synchronize` (new push)
    # re-checks the label so a push to an unlabeled PR does nothing. Dispatch
    # path always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # On a PR, deploy the PR's merge/head ref (default checkout already
          # resolves this for pull_request events); dispatch uses the branch it
          # was launched from.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: pnpm

      - name: Resolve target slot
        id: slot
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          [ -z "$SLOT" ] && SLOT="${{ vars.CI_DEPLOY_SLOT }}"
          [ -z "$SLOT" ] && SLOT="${{ env.DEFAULT_CI_SLOT }}"
          if ! printf '%s' "$SLOT" | grep -Eq '^ws-slot[0-9]{2}$'; then
            echo "::error::Slot '$SLOT' does not match ws-slotNN (participant-stack.ts fails fast on anything else)."
            exit 1
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo ">>> Target slot: $SLOT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600

      - name: Authenticate to ECR Public (device-client build image)
        # sandbox.sh builds the IoT Device Client inside public.ecr.aws/amazonlinux.
        # An explicit login avoids anonymous-pull rate limits / stale-token failures.
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Deploy slot
        run: pnpm run sandbox "${{ steps.slot.outputs.slot }}"

      - name: Smoke test
        env:
          WORKSHOP_TEST_SLOT: ${{ steps.slot.outputs.slot }}
        run: pnpm test

      - name: Comment deploy result on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const slot = '${{ steps.slot.outputs.slot }}';
            const ok = '${{ job.status }}' === 'success';
            const body = ok
              ? `✅ Deployed slot \`${slot}\` from this PR (smoke test passed). It is **left running** for validation — reclaim with \`scripts/teardown.sh ${slot}\` when done.`
              : `❌ Slot deploy for \`${slot}\` failed (status: ${{ job.status }}). See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
